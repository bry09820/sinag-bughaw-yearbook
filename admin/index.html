<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Sinag-Bughaw</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --iris-blue: #3F51B5;
            --iris-hover: #303F9F;
            --bg-light: #E5E5E5;
            --text-main: #333;
            --text-muted: #888;
            --warning-bg: #FFF9E6;
            --warning-border: #FFD966;
            --warning-text: #856404;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background: white;
            width: 100%;
            max-width: 400px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .header-accent {
            background-color: var(--iris-blue);
            height: 60px;
            width: 100%;
        }

        .login-content {
            padding: 40px 30px;
            text-align: center;
        }

        .icon-circle {
            background: var(--iris-blue);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: -65px auto 20px; /* Pulls it up into the blue bar area slightly */
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(63, 81, 181, 0.3);
        }

        h2 {
            margin: 0;
            font-size: 24px;
            color: var(--text-main);
            font-weight: 700;
        }

        p.subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 5px;
            margin-bottom: 25px;
        }

        .security-notice {
            background-color: var(--warning-bg);
            border: 1px solid var(--warning-border);
            padding: 12px;
            border-radius: 10px;
            text-align: left;
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .security-notice i {
            color: #D4A017;
            margin-top: 3px;
        }

        .security-notice span {
            font-size: 11px;
            color: var(--warning-text);
            line-height: 1.4;
        }

        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #ccc;
            font-size: 14px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 12px 12px 38px;
            border: 1px solid #E0E0E0;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border 0.3s ease;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--iris-blue);
        }

        .btn-login {
            width: 100%;
            background-color: var(--iris-blue);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            transition: background 0.3s;
        }

        .btn-login:hover {
            background-color: var(--iris-hover);
        }

        .forgot-pass {
            display: block;
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
        }

        .forgot-pass:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="header-accent"></div>
        <div class="login-content">
            <div class="icon-circle">
                <i class="fas fa-user-graduate"></i>
            </div>
            
            <h2>Admin Portal</h2>
            <p class="subtitle">NU Lipa Digital Yearbook System</p>

            <div class="security-notice">
                <i class="fas fa-lock"></i>
                <span><strong>Security Notice:</strong><br>This system is monitored. Unauthorized access attempts are logged and may be reported.</span>
            </div>

            <form>
                <div class="input-group">
                    <label>Admin Username</label>
                    <div class="input-wrapper">
                        <i class="far fa-user"></i>
                        <input type="text" placeholder="Enter username">
                    </div>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-shield-alt"></i> Secure Login
                </button>
            </form>

            <a href="#" class="forgot-pass">Forgot Password?</a>
        </div>
    </div>

</body>
</html>
