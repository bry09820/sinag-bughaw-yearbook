services:
  - type: web
    name: sinag-bughaw
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/app-config
    envVars:
      - key: APP_NAME
        value: Sinag Bughaw
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Must be a Laravel key ("base64:..."), generate locally with: php artisan key:generate --show
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # Supabase Postgres: use the Session pooler (IPv4); the direct host is IPv6-only and unreachable from Render.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require

      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync

      - key: MAIL_MAILER
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        sync: false
      - key: BREVO_API_KEY
        sync: false
